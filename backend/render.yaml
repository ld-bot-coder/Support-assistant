services:
  - type: web
    name: support-assistant-backend
    env: docker
    dockerfilePath: Dockerfile
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://ollama.com/v1
      - key: OPENAI_MODEL
        value: gpt-oss:20b
      - key: DATABASE_URL
        value: sqlite:///./support_assistant.db
